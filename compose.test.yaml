name: backend-business-card-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: business_card
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: business_card_test
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_card -d business_card_test']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
volumes:
  test-data:
